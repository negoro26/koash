name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete,taplo-cli,typos-cli
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh
      - name: Mount a btrfs volume
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs
          truncate -s 2G "$RUNNER_TEMP/btrfs.img"
          mkfs.btrfs -q "$RUNNER_TEMP/btrfs.img"
          sudo mkdir -p /mnt/btrfs
          sudo mount -o loop "$RUNNER_TEMP/btrfs.img" /mnt/btrfs
          sudo chown "$(id -u):$(id -g)" /mnt/btrfs
      - name: Undo of a file over the copy budget on btrfs
        env:
          KOA_TEST_REFLINK_DIR: /mnt/btrfs
        run: cargo nextest run -p shell-cli --test regressions --locked a_file_over_the_copy_budget
      - name: Unmount and delete the btrfs image
        if: always()
        run: |
          sudo umount /mnt/btrfs || true
          rm -f "$RUNNER_TEMP/btrfs.img"
