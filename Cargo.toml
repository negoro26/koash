[workspace]
resolver = "3"
members = [
    "crates/shell-syntax",
    "crates/shell-value",
    "crates/shell-kernel",
    "crates/shell-builtins",
    "crates/shell-rpc",
    "crates/shell-surface",
    "crates/shell-tui",
    "crates/shell-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Alex Negrescu"]

[workspace.dependencies]
shell-syntax = { path = "crates/shell-syntax" }
shell-value = { path = "crates/shell-value" }
shell-kernel = { path = "crates/shell-kernel" }
shell-builtins = { path = "crates/shell-builtins" }
shell-rpc = { path = "crates/shell-rpc" }
shell-surface = { path = "crates/shell-surface" }
shell-tui = { path = "crates/shell-tui" }

nix = { version = "0.29", features = ["process", "signal", "term", "fs", "ioctl", "poll"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crossterm = "0.28"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
globset = "0.4"
rustc-hash = "2"
memchr = "2"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
